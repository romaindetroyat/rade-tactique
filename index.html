<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rade Tactique</title>
<meta name="description" content="Rade de Toulon en 3D : vent local, parcours CVAT, routage J80 et conseils tactiques.">
<meta name="theme-color" content="#0c2236">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rade Tactique">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">⛵</span><div><b>Rade Tactique</b><small id="status">Chargement…</small></div></div>
    <div class="when">
      <div class="seg" id="daySeg"></div>
      <div class="hour"><input id="hour" type="range" min="6" max="21" step="0.25" value="11"><output id="hourLbl">11:00</output></div>
    </div>
    <div class="src seg" id="srcSeg">
      <button data-src="forecast" class="on">Prévision</button><button data-src="manual">Manuel</button>
    </div>
    <button id="refresh" class="icon" title="Mettre à jour la météo">⟳</button>
  </header>

  <main id="stage">
    <div id="view"></div>
    <div id="hud">
      <div id="compass" title="Nord en haut : toucher pour réorienter"><div class="needle">N</div></div>
      <div id="windBadge"></div>
    </div>
    <div id="mapBtns">
      <button data-v="top" title="Vue de dessus">2D</button>
      <button data-v="tilt" title="Vue inclinée">3D</button>
      <button data-v="course" title="Cadrer le parcours">⌖</button>
      <button data-v="boat" title="Suivre ma position">◎</button>
      <button data-v="layers" title="Calques">☰</button>
    </div>
    <div id="layersMenu" hidden>
      <label><input type="checkbox" data-layer="wind" checked> Carte du vent (couleurs)</label>
      <label><input type="checkbox" data-layer="particles" checked> Filets de vent animés</label>
      <label><input type="checkbox" data-layer="routes" checked> Routes optimales</label>
      <label><input type="checkbox" data-layer="labels" checked> Noms des lieux</label>
      <label style="display:block">Relief (exagération)<input type="range" id="exag" min="1" max="4" step="0.5" value="1.5"></label>
    </div>
    <div id="legend"></div>
    <div id="pickPop" hidden></div>
  </main>

  <aside id="panel">
    <div id="grab"><span></span></div>
    <nav id="tabs">
      <button data-tab="brief" class="on">Briefing</button>
      <button data-tab="course">Parcours</button>
      <button data-tab="start">Départ</button>
      <button data-tab="live">En course</button>
      <button data-tab="wind">Vent</button>
      <button data-tab="j80">J80</button>
      <button data-tab="ic">IC</button>
    </nav>
    <div id="content">
      <section data-tab="brief" class="on"></section>
      <section data-tab="course"></section>
      <section data-tab="start"></section>
      <section data-tab="live"></section>
      <section data-tab="wind"></section>
      <section data-tab="j80"></section>
      <section data-tab="ic"></section>
    </div>
  </aside>
</div>
<div id="splash"><div><div class="logo big">⛵</div><b>Rade Tactique</b><small>Préparation du modèle 3D…</small></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
